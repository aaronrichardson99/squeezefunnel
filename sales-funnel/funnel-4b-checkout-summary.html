<!-- ============================================================================
     FITNESSFORGE — CHECKOUT ORDER-SUMMARY SIDEBAR (drop-in widget)
     ============================================================================
     Goes in the RIGHT column of your checkout, next to GoHighLevel's native
     Order Form element (which goes in the left column and takes the £39.99
     payment). This is fully self-contained — the styling is baked in, so
     you DON'T need to touch the page's Custom CSS field. Just:

       1. On the checkout page, add a Row with 2 columns.
       2. Left column  -> GHL's native Order Form element (£39.99 product,
          success redirect = your Upsell step).
       3. Right column -> a Custom Code element, and paste THIS whole file in.

     Shows only the £39.99 base product, because the upsell (£9.99) and
     downsell (£4.99) are now charged AFTER checkout as 1-click offers.
     ============================================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  /* Scoped styling for the summary widget (pulled from the checkout so it
     matches the rest of the page exactly). No page background / full-height
     here — it's a column widget, so it blends into whatever it sits in. */
  .ff-sum, .ff-sum *, .ff-sum *::before, .ff-sum *::after { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  .ff-sum {
    --navy:#0f172a; --navy-3:#334155; --grey-50:#f8fafc; --grey-100:#f1f5f9; --grey-200:#e2e8f0; --grey-400:#94a3b8; --grey-500:#64748b; --success:#16a34a;
    --shadow-sm:0 2px 8px rgba(5,7,13,0.06); --radius-md:20px; --radius-lg:28px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--navy); line-height:1.6;
  }
  .ff-sum h3 { font-family:'Manrope','Inter',sans-serif; font-weight:800; letter-spacing:-0.02em; color:var(--navy); }

  .ff-co-summary { background:#fff; border:1px solid var(--grey-200); border-radius:var(--radius-lg); padding:32px; box-shadow:var(--shadow-sm); }
  .ff-co-summary h3 { font-size:17px; margin-bottom:20px; }
  .ff-co-line-item { display:flex; gap:14px; align-items:center; }
  .ff-co-thumb { flex-shrink:0; width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg,var(--navy),var(--navy-3)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Manrope',sans-serif; font-weight:800; font-size:11px; }
  .ff-co-line-item-info { flex:1; min-width:0; }
  .ff-co-line-item-info h4 { font-size:14.5px; margin-bottom:2px; font-weight:700; }
  .ff-co-line-item-info span { font-size:12px; color:var(--grey-500); }
  .ff-co-line-item-price { font-family:'Manrope',sans-serif; font-weight:800; font-size:14.5px; flex-shrink:0; }

  .ff-co-totals { margin-top:22px; padding-top:18px; border-top:1px solid var(--grey-200); }
  .ff-co-totals-row { display:flex; justify-content:space-between; font-size:14px; color:var(--grey-500); margin-bottom:10px; }
  .ff-co-totals-row.grand { font-size:17px; color:var(--navy); font-weight:800; margin-top:12px; padding-top:12px; border-top:1px dashed var(--grey-200); margin-bottom:0; }
  .ff-co-totals-row.grand span:last-child { font-family:'Manrope',sans-serif; font-size:22px; }

  .ff-co-guarantee { display:flex; gap:12px; align-items:flex-start; background:var(--grey-50); border-radius:var(--radius-md); padding:18px; margin-top:22px; }
  .ff-co-guarantee svg { flex-shrink:0; color:var(--navy); margin-top:2px; }
  .ff-co-guarantee strong { display:block; font-size:13.5px; margin-bottom:3px; }
  .ff-co-guarantee p { font-size:12.5px; color:var(--grey-500); line-height:1.5; }

  .ff-co-trust-row { display:flex; flex-wrap:wrap; gap:16px; margin-top:22px; }
  .ff-co-trust-row div { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--grey-400); font-weight:600; }
  .ff-co-trust-row svg { color:var(--success); flex-shrink:0; }
</style>

<div class="ff-sum">
  <div class="ff-co-summary">
    <h3>Order Summary</h3>

    <div class="ff-co-line-item">
      <div class="ff-co-thumb">FF</div>
      <div class="ff-co-line-item-info"><h4>The Physique Builder Blueprint</h4><span>12-week digital programme</span></div>
      <div class="ff-co-line-item-price">£39.99</div>
    </div>

    <div class="ff-co-totals">
      <div class="ff-co-totals-row"><span>Subtotal</span><span>£39.99</span></div>
      <div class="ff-co-totals-row grand"><span>Total Due Today</span><span>£39.99</span></div>
    </div>

    <div class="ff-co-guarantee">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 8l10 6 10-6-10-6Z"/><path d="m2 14 10 6 10-6"/></svg>
      <div><strong>14-Day Money-Back Guarantee</strong><p>Not right for you? Email us within 14 days for a full refund, no questions asked.</p></div>
    </div>

    <div class="ff-co-trust-row">
      <div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Secure Checkout</div>
      <div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Instant Access</div>
      <div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>No Hidden Fees</div>
    </div>
  </div>
</div>
