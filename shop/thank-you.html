<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — FitnessForge</title>
<meta name="description" content="Your FitnessForge order is confirmed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shop.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="logo"><span class="logo-mark">FF</span>FitnessForge</a>
    <div class="nav-right">
      <a href="cart.html" class="cart-btn" aria-label="View cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count">0</span>
      </a>
    </div>
  </div>
</header>

<main>
<div class="container">
  <div class="ty-hero">
    <div class="ty-check">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Welcome To FitnessForge<span id="tyName"></span>!</h1>
    <p>Your order is confirmed. Check your inbox — your programs are on their way and you can start today.</p>
  </div>

  <div class="ty-order" id="tyOrder"></div>

  <div class="center" style="padding-bottom:60px;">
    <a href="programs.html" class="btn btn-dark btn-lg">Browse More Programs
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">&copy; <span id="year"></span> FitnessForge. Build muscle. Backed by science.</div>
  </div>
</footer>

<script src="assets/shop.js"></script>
<script>
(function(){
  var order;
  try{ order = JSON.parse(sessionStorage.getItem("ff_order")); }catch(e){}
  var box = document.getElementById("tyOrder");
  if(!order || !order.items || !order.items.length){
    box.innerHTML = '<p class="muted center">No recent order found. <a href="programs.html" style="color:var(--gold);font-weight:600;">Shop programs</a>.</p>';
    return;
  }
  if(order.name){ document.getElementById("tyName").textContent = ", " + order.name.split(" ")[0]; }
  var rows = order.items.map(function(i){
    return '<div class="sum-row"><span>'+FF.esc(i.name)+'</span><span class="tabnum">'+FF.money(i.price)+'</span></div>';
  }).join("");
  box.innerHTML =
    '<h3>Order Confirmed <span>'+FF.esc(order.email||"")+'</span></h3>'
    + rows
    + '<div class="sum-row total"><span>Total Paid</span><span class="tabnum">'+FF.money(order.total)+'</span></div>';
})();
</script>
</body>
</html>
