<!-- FitnessForge Shop — single GoHighLevel block. Paste this ENTIRE thing into ONE
     Custom Code / HTML element on ONE blank GHL page. Nothing goes in Custom CSS.
     The whole store (browse -> product -> cart -> upsell/downsell -> checkout) runs
     inside this block. It won't animate in the GHL editor — Save then Preview/Publish. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
#ffapp{
  --white:#ffffff;
  --navy:#0f172a;
  --navy-2:#1e293b;
  --navy-3:#334155;
  --grey-50:#f8fafc;
  --grey-100:#f1f5f9;
  --grey-200:#e2e8f0;
  --grey-300:#cbd5e1;
  --grey-400:#94a3b8;
  --grey-500:#64748b;
  --gold:#f59e0b;
  --gold-2:#d97706;
  --gold-soft:rgba(245,158,11,0.12);
  --success:#16a34a;
  --success-soft:rgba(22,163,74,0.12);
  --danger:#dc2626;
  --shadow-sm:0 1px 3px rgba(15,23,42,0.06);
  --shadow-md:0 8px 24px rgba(15,23,42,0.08);
  --shadow-lg:0 16px 40px rgba(15,23,42,0.12);
  --shadow-xl:0 30px 70px rgba(15,23,42,0.18);
  --radius-sm:12px;
  --radius-md:18px;
  --radius-lg:28px;
  --radius-full:999px;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --container:1180px;
}
#ffapp *,#ffapp *::before,#ffapp *::after{box-sizing:border-box;}
#ffapp{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
#ffapp{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--navy);background:var(--grey-50);line-height:1.6;
  overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;
}
#ffapp h1,#ffapp h2,#ffapp h3,#ffapp h4{font-family:'Poppins',ui-rounded,'Segoe UI',system-ui,sans-serif;line-height:1.12;margin:0;font-weight:800;}
#ffapp p{margin:0;}
#ffapp a{color:inherit;text-decoration:none;}
#ffapp img{max-width:100%;display:block;}
#ffapp button{font-family:inherit;cursor:pointer;border:none;background:none;}
#ffapp input,#ffapp select,#ffapp textarea{font-family:inherit;}
#ffapp ul{margin:0;padding:0;list-style:none;}
#ffapp .container{width:100%;max-width:var(--container);margin:0 auto;padding:0 20px;}
#ffapp .narrow{max-width:820px;}
#ffapp main{flex:1;}
#ffapp .highlight{color:var(--gold);}
#ffapp .muted{color:var(--grey-500);}
#ffapp .tabnum{font-variant-numeric:tabular-nums;}
#ffapp .center{text-align:center;}
#ffapp .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 26px;border-radius:var(--radius-full);
  font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1;
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .3s var(--ease),border-color .3s var(--ease);
  white-space:nowrap;min-height:48px;
}
#ffapp .btn svg{transition:transform .4s var(--ease);flex:none;}
#ffapp .btn-primary{background:var(--gold);color:var(--navy);box-shadow:0 10px 24px rgba(245,158,11,.35);}
#ffapp .btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(245,158,11,.5);}
#ffapp .btn-primary:hover svg{transform:translateX(4px);}
#ffapp .btn-dark{background:var(--navy);color:#fff;box-shadow:var(--shadow-md);}
#ffapp .btn-dark:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
#ffapp .btn-dark:hover svg{transform:translateX(4px);}
#ffapp .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--grey-300);}
#ffapp .btn-ghost:hover{border-color:var(--navy);transform:translateY(-3px);}
#ffapp .btn-block{width:100%;}
#ffapp .btn-lg{padding:17px 32px;font-size:16px;}
#ffapp .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
#ffapp .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:var(--radius-full);background:var(--gold-soft);color:#b45309;font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
#ffapp .eyebrow svg{color:var(--gold);}
#ffapp .stars{color:var(--gold);letter-spacing:2px;font-size:15px;}
#ffapp .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
#ffapp .reveal.is-visible{opacity:1;transform:none;}
#ffapp .nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,.9);backdrop-filter:blur(14px);box-shadow:var(--shadow-sm);}
#ffapp .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;}
#ffapp .logo{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--navy);}
#ffapp .logo-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--navy-3));color:var(--gold);font-size:15px;font-weight:800;box-shadow:var(--shadow-sm);}
#ffapp .nav-links{display:none;align-items:center;gap:28px;}
#ffapp .nav-links a{position:relative;font-weight:600;font-size:15px;color:var(--navy-3);padding:4px 0;}
#ffapp .nav-links a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);transition:width .35s var(--ease);}
#ffapp .nav-links a:hover,#ffapp .nav-links a.active{color:var(--navy);}
#ffapp .nav-links a:hover::after,#ffapp .nav-links a.active::after{width:100%;}
#ffapp .nav-right{display:flex;align-items:center;gap:10px;}
#ffapp .cart-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:var(--white);box-shadow:var(--shadow-sm);color:var(--navy);transition:transform .35s var(--ease),box-shadow .35s var(--ease);}
#ffapp .cart-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
#ffapp .cart-count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--radius-full);background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:var(--shadow-sm);transform:scale(0);transition:transform .3s var(--ease);}
#ffapp .cart-count.show{transform:scale(1);}
#ffapp .cart-btn.bump{animation:bump .4s var(--ease);}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
#ffapp .nav-burger{display:inline-flex;flex-direction:column;gap:5px;padding:12px;border-radius:12px;background:var(--white);box-shadow:var(--shadow-sm);}
#ffapp .nav-burger span{width:20px;height:2.5px;background:var(--navy);border-radius:2px;transition:transform .35s var(--ease),opacity .3s var(--ease);}
#ffapp .nav-burger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
#ffapp .nav-burger.open span:nth-child(2){opacity:0;}
#ffapp .nav-burger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}
#ffapp .mobile-menu{position:fixed;top:0;right:0;bottom:0;z-index:120;width:min(80vw,320px);background:var(--white);box-shadow:var(--shadow-xl);transform:translateX(100%);transition:transform .45s var(--ease);padding:88px 26px 26px;display:flex;flex-direction:column;gap:4px;}
#ffapp .mobile-menu.open{transform:translateX(0);}
#ffapp .mobile-menu a{padding:14px 8px;font-weight:600;font-size:17px;border-bottom:1px solid var(--grey-100);color:var(--navy-2);}
#ffapp .menu-backdrop{position:fixed;inset:0;z-index:119;background:rgba(15,23,42,.4);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s;}
#ffapp .menu-backdrop.open{opacity:1;visibility:visible;}
@media(min-width:940px){#ffapp .nav-links{display:flex;}
#ffapp .nav-burger{display:none;}}
#ffapp .page-head{padding:54px 0 40px;text-align:center;}
#ffapp .page-head .eyebrow{margin-bottom:16px;}
#ffapp .page-head h1{font-size:clamp(30px,5.5vw,50px);letter-spacing:-.5px;margin-bottom:14px;text-wrap:balance;}
#ffapp .page-head p{color:var(--grey-500);font-size:clamp(15px,2.2vw,18px);max-width:600px;margin:0 auto;}
#ffapp .crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--grey-400);margin-bottom:22px;}
#ffapp .crumbs a:hover{color:var(--gold);}
#ffapp .crumbs span{color:var(--grey-300);}
#ffapp .cover{position:relative;aspect-ratio:4/5;border-radius:var(--radius-md);overflow:hidden;color:#fff;padding:26px 22px;display:flex;flex-direction:column;box-shadow:var(--shadow-md);border-left:5px solid rgba(245,158,11,.6);}
#ffapp .cover.blueprint{background:linear-gradient(155deg,#0f172a,#1e293b 55%,#334155);}
#ffapp .cover.masterclass{background:linear-gradient(155deg,#111c34,#243b6b 60%,#1e293b);}
#ffapp .cover.cookbook{background:linear-gradient(155deg,#3b2f12,#7c5a16 55%,#b45309);}
#ffapp .cover.nutrition{background:linear-gradient(155deg,#0b2a1f,#14532d 55%,#166534);}
#ffapp .cover.mealplan{background:linear-gradient(155deg,#3a1d0b,#9a3412 55%,#c2410c);}
#ffapp .cover.upperlower{background:linear-gradient(155deg,#1e1b4b,#4338ca 55%,#6d28d9);}
#ffapp .cover .c-tag{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);}
#ffapp .cover.nutrition .c-tag,#ffapp .cover.mealplan .c-tag,#ffapp .cover.cookbook .c-tag{color:#fde68a;}
#ffapp .cover h3{font-size:clamp(19px,2.2vw,25px);margin:12px 0;line-height:1.14;overflow-wrap:anywhere;hyphens:auto;}
#ffapp .cover .c-div{width:44px;height:3px;background:var(--gold);border-radius:2px;margin-bottom:12px;}
#ffapp .cover .c-sub{font-size:13px;color:rgba(255,255,255,.82);line-height:1.5;}
#ffapp .cover .c-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);}
#ffapp .cover .c-foot .logo{font-size:12px;color:#fff;gap:6px;}
#ffapp .cover .c-foot .logo-mark{width:22px;height:22px;border-radius:6px;font-size:10px;}
#ffapp .shop-grid{display:grid;grid-template-columns:1fr;gap:24px;padding-bottom:20px;}
@media(min-width:640px){#ffapp .shop-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:980px){#ffapp .shop-grid{grid-template-columns:repeat(3,1fr);}}
#ffapp .product-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-lg);overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s var(--ease);}
#ffapp .product-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);}
#ffapp .product-card .pc-cover{padding:22px 22px 0;}
#ffapp .product-card .cover{aspect-ratio:16/10;}
#ffapp .product-card .pc-body{padding:20px 22px 24px;display:flex;flex-direction:column;flex:1;}
#ffapp .pc-badge{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:5px 11px;border-radius:var(--radius-full);background:var(--gold-soft);color:#b45309;margin-bottom:12px;}
#ffapp .pc-badge.best{background:var(--navy);color:var(--gold);}
#ffapp .product-card h3{font-size:20px;margin-bottom:8px;}
#ffapp .product-card .pc-desc{color:var(--grey-500);font-size:14.5px;margin-bottom:16px;flex:1;}
#ffapp .price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;}
#ffapp .price-now{font-family:'Poppins',sans-serif;font-weight:800;font-size:26px;}
#ffapp .price-was{color:var(--grey-400);text-decoration:line-through;font-size:15px;}
#ffapp .pc-actions{display:flex;gap:10px;}
#ffapp .pc-actions .btn{flex:1;padding:13px 16px;}
#ffapp .product-detail{display:grid;grid-template-columns:1fr;gap:40px;padding:20px 0 40px;align-items:start;}
@media(min-width:900px){#ffapp .product-detail{grid-template-columns:0.9fr 1.1fr;gap:56px;}}
#ffapp .pd-media{position:static;}
#ffapp .pd-media .cover{aspect-ratio:4/5;max-width:420px;margin:0 auto;}
#ffapp .pd-info h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.5px;margin:14px 0;text-wrap:balance;}
#ffapp .pd-rating{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--grey-500);margin-bottom:18px;}
#ffapp .pd-price{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;}
#ffapp .pd-price .now{font-family:'Poppins',sans-serif;font-weight:800;font-size:38px;}
#ffapp .pd-price .was{color:var(--grey-400);text-decoration:line-through;font-size:18px;}
#ffapp .pd-save{display:inline-block;background:var(--success-soft);color:var(--success);font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:var(--radius-full);margin-bottom:20px;}
#ffapp .pd-desc{color:var(--navy-3);font-size:16px;margin-bottom:22px;}
#ffapp .pd-list{display:flex;flex-direction:column;gap:12px;margin-bottom:26px;}
#ffapp .pd-list li{display:flex;align-items:flex-start;gap:11px;font-size:15px;color:var(--navy-3);}
#ffapp .pd-list li svg{flex:none;margin-top:3px;color:var(--success);}
#ffapp .pd-cta{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
@media(min-width:480px){#ffapp .pd-cta{flex-direction:row;}}
#ffapp .pd-cta .btn-primary{flex:1;}
#ffapp .pd-trust{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--grey-500);}
#ffapp .pd-trust span{display:inline-flex;align-items:center;gap:7px;}
#ffapp .pd-trust svg{color:var(--success);}
#ffapp .cart-layout{display:grid;grid-template-columns:1fr;gap:28px;padding:10px 0 40px;align-items:start;}
@media(min-width:880px){#ffapp .cart-layout{grid-template-columns:1.6fr 1fr;}}
#ffapp .cart-items{display:flex;flex-direction:column;gap:16px;}
#ffapp .cart-item{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-md);padding:16px;transition:box-shadow .4s var(--ease);}
#ffapp .cart-item:hover{box-shadow:var(--shadow-md);}
#ffapp .ci-thumb{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;}
#ffapp .ci-main .ci-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;}
#ffapp .ci-main .ci-meta{font-size:13px;color:var(--grey-400);}
#ffapp .ci-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#ffapp .ci-price{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;}
#ffapp .ci-remove{font-size:12.5px;color:var(--grey-400);display:inline-flex;align-items:center;gap:5px;transition:color .3s var(--ease);}
#ffapp .ci-remove:hover{color:var(--danger);}
#ffapp .cart-empty{background:#fff;border:1px dashed var(--grey-300);border-radius:var(--radius-lg);padding:56px 24px;text-align:center;}
#ffapp .cart-empty svg{color:var(--grey-300);margin-bottom:16px;}
#ffapp .cart-empty h3{font-size:22px;margin-bottom:8px;}
#ffapp .cart-empty p{color:var(--grey-500);margin-bottom:22px;}
#ffapp .summary{background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-lg);padding:26px;position:sticky;top:90px;}
#ffapp .summary h3{font-size:19px;margin-bottom:18px;}
#ffapp .sum-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--navy-3);padding:9px 0;}
#ffapp .sum-row.total{border-top:1.5px solid var(--grey-200);margin-top:8px;padding-top:16px;font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--navy);}
#ffapp .sum-row .free{color:var(--success);font-weight:700;}
#ffapp .summary .btn{margin-top:18px;}
#ffapp .sum-note{margin-top:14px;font-size:12.5px;color:var(--grey-400);display:flex;align-items:center;gap:7px;justify-content:center;}
#ffapp .sum-note svg{color:var(--grey-400);}
#ffapp .offer{padding:40px 0 60px;}
#ffapp .offer-card{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;}
#ffapp .offer-top{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:26px 30px;text-align:center;}
#ffapp .offer-top .eyebrow{background:rgba(245,158,11,.18);color:var(--gold);margin-bottom:12px;}
#ffapp .offer-top h1{font-size:clamp(22px,3.6vw,30px);text-wrap:balance;}
#ffapp .offer-progress{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12px;color:var(--grey-300);}
#ffapp .offer-progress .dot{width:8px;height:8px;border-radius:50%;background:var(--navy-3);}
#ffapp .offer-progress .dot.on{background:var(--gold);}
#ffapp .offer-body{padding:30px;display:grid;grid-template-columns:1fr;gap:26px;align-items:center;}
@media(min-width:640px){#ffapp .offer-body{grid-template-columns:180px 1fr;}}
#ffapp .offer-body .cover{aspect-ratio:4/5;}
#ffapp .offer-detail h2{font-size:22px;margin-bottom:10px;}
#ffapp .offer-detail p{color:var(--grey-500);font-size:15px;margin-bottom:16px;}
#ffapp .offer-detail .pd-list{margin-bottom:18px;}
#ffapp .offer-price{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
#ffapp .offer-price .now{font-family:'Poppins',sans-serif;font-weight:800;font-size:32px;color:var(--gold-2);}
#ffapp .offer-price .was{color:var(--grey-400);text-decoration:line-through;font-size:17px;}
#ffapp .offer-actions{padding:0 30px 30px;display:flex;flex-direction:column;gap:12px;}
#ffapp .offer-decline{background:none;color:var(--grey-500);font-size:14px;font-weight:600;text-align:center;padding:10px;transition:color .3s var(--ease);text-decoration:underline;text-underline-offset:3px;}
#ffapp .offer-decline:hover{color:var(--navy);}
#ffapp .offer-note{text-align:center;font-size:12.5px;color:var(--grey-400);}
#ffapp .checkout-layout{display:grid;grid-template-columns:1fr;gap:28px;padding:10px 0 50px;align-items:start;}
@media(min-width:880px){#ffapp .checkout-layout{grid-template-columns:1.3fr 1fr;}}
#ffapp .form-card{background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-lg);padding:28px;}
#ffapp .form-card h2{font-size:20px;margin-bottom:6px;}
#ffapp .form-card .sub{color:var(--grey-500);font-size:14px;margin-bottom:22px;}
#ffapp .field-group{display:flex;flex-direction:column;gap:16px;}
#ffapp .field{display:flex;flex-direction:column;gap:7px;}
#ffapp .field label{font-size:13px;font-weight:600;color:var(--navy-2);}
#ffapp .field input,#ffapp .field select{border:1.5px solid var(--grey-200);border-radius:12px;padding:13px 15px;font-size:15px;color:var(--navy);background:#fff;transition:border-color .3s var(--ease),box-shadow .3s var(--ease);}
#ffapp .field input:focus,#ffapp .field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
#ffapp .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
#ffapp .pay-note{margin-top:18px;padding:14px 16px;background:var(--grey-50);border-radius:12px;font-size:13px;color:var(--grey-500);display:flex;gap:10px;align-items:flex-start;}
#ffapp .pay-note svg{flex:none;color:var(--gold);margin-top:1px;}
#ffapp .ty-hero{text-align:center;padding:60px 0 30px;}
#ffapp .ty-check{width:84px;height:84px;border-radius:50%;background:var(--success-soft);display:grid;place-items:center;margin:0 auto 24px;animation:pop .5s var(--ease);}
#ffapp .ty-check svg{color:var(--success);}
@keyframes pop{0%{transform:scale(0);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
#ffapp .ty-hero h1{font-size:clamp(28px,5vw,44px);margin-bottom:14px;}
#ffapp .ty-hero p{color:var(--grey-500);font-size:17px;max-width:520px;margin:0 auto;}
#ffapp .ty-order{max-width:560px;margin:10px auto 40px;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-lg);padding:26px;}
#ffapp .ty-order h3{font-size:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
#ffapp .ty-order h3 span{font-size:13px;font-weight:600;color:var(--grey-400);}
#ffapp .hero{position:relative;overflow:hidden;padding:64px 0 40px;}
#ffapp .hero-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(80% 60% at 82% 0%,rgba(245,158,11,.10),transparent 60%),radial-gradient(70% 60% at 0% 20%,rgba(15,23,42,.05),transparent 55%);}

<script>
/* =========================================================
   FitnessForge Store — shared logic
   Catalog · localStorage cart · nav/menu · reveal · toast
   Buy flow: Add to Cart -> Upsell -> Downsell -> Cart -> Checkout -> Thank You
   ========================================================= */
(function(global){
  "use strict";

  /* ---------------- Catalog ---------------- */
  var CATALOG = {
    blueprint: {
      id:"blueprint", name:"Physique Builder Blueprint", price:39.99, compare:99,
      cover:"blueprint", tag:"Complete System", badge:"Best Value", badgeClass:"best",
      rating:4.9, reviews:238,
      short:"The complete training + nutrition system that takes you from guessing to a clear, week-by-week plan.",
      bullets:[
        "12-week structured training program",
        "Full nutrition & macro system",
        "Progress tracking templates",
        "Exercise technique video library",
        "Six connected resources, one purchase",
        "14-day risk-free guarantee"
      ]
    },
    upperlower: {
      id:"upperlower", name:"9-Week Upper/Lower Program", price:29.99, compare:59.99,
      cover:"upperlower", tag:"Training Program", badge:"4-Day Split",
      rating:4.9, reviews:87,
      short:"The intermediate upper/lower split that trains every muscle twice a week for faster size and strength. Four sessions a week, nine weeks, every set mapped out.",
      bullets:[
        "9-week upper/lower training block",
        "4 structured sessions every week",
        "Hits each muscle group twice a week",
        "Progressive overload mapped week by week",
        "Exercise swaps for any gym or home setup",
        "Warm-up, sets, reps & rest all laid out"
      ]
    },
    masterclass: {
      id:"masterclass", name:"Progressive Overload Masterclass", price:14.99, compare:29.99,
      cover:"masterclass", tag:"Video Masterclass", badge:"New",
      rating:4.9, reviews:64,
      short:"Master the single most important principle for building muscle — how to progress correctly, every week.",
      bullets:[
        "Step-by-step video lessons",
        "How to add weight, reps & sets safely",
        "Break through training plateaus",
        "Track progression the right way",
        "Lifetime access, watch anywhere"
      ]
    },
    cookbook: {
      id:"cookbook", name:"The FitnessForge Cookbook", price:19.99,
      cover:"cookbook", tag:"Recipe Collection", badge:"Popular",
      rating:4.8, reviews:121,
      short:"High-protein meals that actually taste good — simple recipes built to support muscle growth and fat loss.",
      bullets:[
        "60+ high-protein recipes",
        "Breakfasts, mains, snacks & desserts",
        "Full macros listed for every meal",
        "Simple ingredients, quick to cook",
        "Flexible — no foods off-limits"
      ]
    },
    nutrition: {
      id:"nutrition", name:"Nutrition Fundamentals Guide", price:9.99, compare:24.99,
      cover:"nutrition", tag:"Add-On Guide", badge:"Add-On",
      rating:4.9, reviews:96,
      short:"Make your results happen faster. The simple nutrition system with no calorie-counting spreadsheets or confusing tracking.",
      bullets:[
        "Exactly what to eat & how much",
        "No complicated tracking",
        "Build meals that fit your goals",
        "Perfect companion to the Blueprint"
      ]
    },
    mealplan: {
      id:"mealplan", name:"7-Day Kickstart Meal Plan", price:4.99, compare:14.99,
      cover:"mealplan", tag:"Quick Start", badge:"Starter",
      rating:4.8, reviews:73,
      short:"Not ready for the full guide? Start eating right today. A done-for-you 7-day plan — no planning, no macros, just follow it.",
      bullets:[
        "A full 7 days planned for you",
        "No planning or thinking required",
        "Simple, tasty, everyday foods",
        "The easiest way to start"
      ]
    }
  };

  var STORE_ITEMS = ["blueprint","upperlower","masterclass","cookbook"]; // shown on shop page
  var CART_KEY = "ff_cart";

  /* ---------------- Cart (localStorage) ---------------- */
  function readCart(){
    try{ return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch(e){ return []; }
  }
  function writeCart(ids){ localStorage.setItem(CART_KEY, JSON.stringify(ids)); updateBadge(); }
  function inCart(id){ return readCart().indexOf(id) !== -1; }
  function addItem(id){
    var c = readCart();
    if(c.indexOf(id) === -1){ c.push(id); writeCart(c); }
    return c;
  }
  function removeItem(id){
    writeCart(readCart().filter(function(x){ return x !== id; }));
  }
  function clearCart(){ localStorage.removeItem(CART_KEY); updateBadge(); }
  function cartProducts(){ return readCart().map(function(id){ return CATALOG[id]; }).filter(Boolean); }
  function cartTotal(){ return cartProducts().reduce(function(s,p){ return s + p.price; }, 0); }
  function money(n){ return "£" + n.toFixed(2); }

  function updateBadge(){
    var count = readCart().length;
    document.querySelectorAll(".cart-count").forEach(function(el){
      el.textContent = count;
      el.classList.toggle("show", count > 0);
    });
  }
  function bumpCart(){
    document.querySelectorAll(".cart-btn").forEach(function(b){
      b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
    });
  }

  /* ---------------- Toast ---------------- */
  var toastTimer;
  function toast(msg){
    var t = document.getElementById("toast");
    if(!t){
      t = document.createElement("div"); t.id = "toast"; t.className = "toast";
      (document.getElementById("ffapp")||document.body).appendChild(t);
    }
    t.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span></span>';
    t.querySelector("span").textContent = msg;
    requestAnimationFrame(function(){ t.classList.add("show"); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  /* ---------------- Buy flow ----------------
     Add a product to the cart, then route into the
     upsell -> downsell -> cart sequence (once per journey). */
  function buy(id){
    addItem(id); bumpCart();
    // If they don't yet have the nutrition add-on, offer the upsell.
    if(!inCart("nutrition")){
      sessionStorage.setItem("ff_from", id);
      FFR.go("upsell.html");
    } else {
      FFR.go("cart.html");
    }
  }

  /* ---------------- Nav / menu / reveal ---------------- */
  function initChrome(){
    updateBadge();

    var burger = document.getElementById("burger"),
        menu = document.getElementById("mobileMenu"),
        backdrop = document.getElementById("backdrop");
    if(burger && menu && backdrop){
      var setMenu = function(open){
        burger.classList.toggle("open", open);
        menu.classList.toggle("open", open);
        backdrop.classList.toggle("open", open);
        burger.setAttribute("aria-expanded", open);
        document.body.style.overflow = open ? "hidden" : "";
      };
      burger.addEventListener("click", function(){ setMenu(!menu.classList.contains("open")); });
      backdrop.addEventListener("click", function(){ setMenu(false); });
      menu.querySelectorAll("a").forEach(function(a){ a.addEventListener("click", function(){ setMenu(false); }); });
    }

    // seamless marquees
    ["trustTrack","reviewRow"].forEach(function(idv){
      var el = document.getElementById(idv);
      if(el) el.innerHTML += el.innerHTML;
    });

    // reveal on scroll
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var reveals = document.querySelectorAll(".reveal");
    if(reduce || !("IntersectionObserver" in window)){
      reveals.forEach(function(el){ el.classList.add("is-visible"); });
    } else {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){
            var sibs = Array.prototype.slice.call(e.target.parentNode.children).filter(function(c){return c.classList.contains("reveal");});
            e.target.style.transitionDelay = (Math.max(0, sibs.indexOf(e.target)) * 0.07) + "s";
            e.target.classList.add("is-visible");
            io.unobserve(e.target);
          }
        });
      }, {threshold:0.12, rootMargin:"0px 0px -40px 0px"});
      reveals.forEach(function(el){ io.observe(el); });
    }

    var yr = document.getElementById("year"); if(yr) yr.textContent = new Date().getFullYear();

    // delegated add-to-cart so dynamically rendered cards work too
    if(!global.__ffBuyBound){ global.__ffBuyBound = true;
    document.addEventListener("click", function(e){
      var btn = e.target.closest ? e.target.closest("[data-buy]") : null;
      if(btn){ e.preventDefault(); buy(btn.getAttribute("data-buy")); }
    }); }
  }

  

  /* ---------------- Render helpers ---------------- */
  var CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function coverHTML(p){
    return '<div class="cover '+p.cover+'">'
      + '<span class="c-tag">'+esc(p.tag)+'</span>'
      + '<h3>'+esc(p.name)+'</h3>'
      + '<div class="c-div"></div>'
      + '<p class="c-sub">'+esc(p.short.split(".")[0])+'.</p>'
      + '<div class="c-foot"><span class="logo"><span class="logo-mark">FF</span>FitnessForge</span></div>'
      + '</div>';
  }

  function cardHTML(p){
    var badge = p.badge ? '<span class="pc-badge '+(p.badgeClass||"")+'">'+esc(p.badge)+'</span>' : "";
    var was = p.compare ? '<span class="price-was">'+money(p.compare)+'</span>' : "";
    return '<article class="product-card reveal">'
      + '<a class="pc-cover" href="product.html?id='+p.id+'">'+coverHTML(p)+'</a>'
      + '<div class="pc-body">'
      + badge
      + '<h3>'+esc(p.name)+'</h3>'
      + '<p class="pc-desc">'+esc(p.short)+'</p>'
      + '<div class="price-row"><span class="price-now">'+money(p.price)+'</span>'+was+'</div>'
      + '<div class="pc-actions">'
      + '<a class="btn btn-ghost" href="product.html?id='+p.id+'">View</a>'
      + '<button class="btn btn-primary" data-buy="'+p.id+'">Add to Cart</button>'
      + '</div></div></article>';
  }

  function renderGrid(el, ids){
    if(!el) return;
    el.innerHTML = ids.map(function(id){ return cardHTML(CATALOG[id]); }).join("");
  }

  /* ---------------- Public API ---------------- */
  global.FF = {
    coverHTML:coverHTML, cardHTML:cardHTML, renderGrid:renderGrid, CHECK:CHECK, esc:esc,
    CATALOG:CATALOG, STORE_ITEMS:STORE_ITEMS,
    readCart:readCart, cartProducts:cartProducts, cartTotal:cartTotal,
    addItem:addItem, removeItem:removeItem, clearCart:clearCart, inCart:inCart,
    buy:buy, initChrome:initChrome, money:money, toast:toast, updateBadge:updateBadge, bumpCart:bumpCart
  };
})(window);

</script>
<script>

(function(){
  var app = document.getElementById("ffapp");
  var current = { search: "" };
  function parse(path){
    path = String(path).replace(/^\.?\//, "");
    var hash="", search="", i;
    i = path.indexOf("#"); if(i>=0){ hash = path.slice(i+1); path = path.slice(0,i); }
    i = path.indexOf("?"); if(i>=0){ search = path.slice(i); path = path.slice(0,i); }
    return { page: path, search: search, hash: hash };
  }
  function toTop(){ try{ app.scrollIntoView({block:"start"}); }catch(e){ window.scrollTo(0,0); } }
  function scrollToHash(hash){
    if(!hash){ toTop(); return; }
    var el = document.getElementById(hash);
    if(el && app.contains(el)){ el.scrollIntoView({behavior:"smooth"}); } else { toTop(); }
  }
  window.FFR = { search:function(){ return current.search; }, go:function(u){ route(u); } };
  function route(url, noScroll){
    var r = parse(url);
    if(!r.page){ scrollToHash(r.hash); return; }
    var page = FF_PAGES[r.page] || FF_PAGES["index.html"];
    current.search = r.search;
    app.innerHTML = page.html;
    if(page.script){ try{ (new Function(page.script))(); }catch(e){ console.error("page script:", e); } }
    if(window.FF && FF.initChrome){ FF.initChrome(); }
    if(r.hash){ setTimeout(function(){ scrollToHash(r.hash); }, 40); }
    else if(!noScroll){ toTop(); }
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if(!a || !app.contains(a)) return;                 // only intercept links inside the shop
    var href = a.getAttribute("href");
    if(!href || /^(https?:|mailto:|tel:)/.test(href)) return;
    if(href.indexOf(".html") >= 0 || href.charAt(0) === "#"){ e.preventDefault(); route(href); }
  });
  route("index.html", true);                           // initial load: no auto-scroll
})();

</script>
