<!-- ============================================================
     BLOCK 11 of 11 — JAVASCRIPT
     Paste into the LAST Custom Code element on the page (below the
     footer block) so it runs after every section above it exists
     in the DOM. Only needed once — do not duplicate this block.
     ============================================================ -->
<script>
(function () {
  "use strict";

  /* ========================================================================
     CONFIGURATION — EDIT THESE VALUES FOR YOUR GOHIGHLEVEL SETUP
     ======================================================================== */
  var CONFIG = {
    // Paste your GoHighLevel inbound webhook / form action URL here.
    // (Workflow → Add Trigger → "Inbound Webhook", or your Form's action URL)
    FORM_ENDPOINT: "",

    // Where to send visitors after a successful signup (optional).
    // Leave empty to keep them on this page and show the inline success message.
    REDIRECT_URL: ""
  };

  /* ----------------------------------------------------------------------
     Flag that JS is running — CSS uses this to enable the scroll-reveal
     fade-in. Without this flag, every section stays visible by default
     (see the "Reveal-on-scroll" comment in squeeze-page.css).
     ---------------------------------------------------------------------- */
  document.documentElement.classList.add("ff-js");

  /* ----------------------------------------------------------------------
     Footer year
     ---------------------------------------------------------------------- */
  var yearEl = document.getElementById("ff-year");
  if (yearEl) { yearEl.textContent = new Date().getFullYear(); }

  /* ----------------------------------------------------------------------
     Scroll-reveal animations (fade + rise into view, once)
     Queries the whole document since each block has its own .ff-page
     wrapper when split across multiple Custom Code elements.
     ---------------------------------------------------------------------- */
  var revealEls = document.querySelectorAll(".ff-reveal");
  if ("IntersectionObserver" in window) {
    var revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(function (el) { revealObserver.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add("is-visible"); });
  }

  /* ----------------------------------------------------------------------
     Animated statistic counters (count up once, on scroll into view)
     ---------------------------------------------------------------------- */
  function animateCount(el) {
    var target = parseInt(el.getAttribute("data-count-to"), 10) || 0;
    var suffix = el.getAttribute("data-suffix") || "";
    var duration = 1800;
    var start = null;

    function step(timestamp) {
      if (!start) start = timestamp;
      var progress = Math.min((timestamp - start) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      var value = Math.floor(eased * target);
      el.textContent = value.toLocaleString() + suffix;
      if (progress < 1) {
        window.requestAnimationFrame(step);
      } else {
        el.textContent = target.toLocaleString() + suffix;
      }
    }
    window.requestAnimationFrame(step);
  }

  var statsSection = document.getElementById("ff-stats");
  if (statsSection && "IntersectionObserver" in window) {
    var statNums = statsSection.querySelectorAll(".ff-stat-num");
    var statsObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          statNums.forEach(animateCount);
          statsObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.4 });
    statsObserver.observe(statsSection);
  } else if (statsSection) {
    statsSection.querySelectorAll(".ff-stat-num").forEach(animateCount);
  }

  /* ----------------------------------------------------------------------
     Testimonial marquee — pause on hover/focus (also handled by CSS,
     JS ensures keyboard-focus users get the same pause behaviour)
     ---------------------------------------------------------------------- */
  var marqueeViewport = document.querySelector(".ff-marquee-viewport");
  var marqueeTrack = document.getElementById("ff-marquee-track");
  if (marqueeViewport && marqueeTrack) {
    marqueeViewport.addEventListener("focusin", function () { marqueeTrack.classList.add("is-paused"); });
    marqueeViewport.addEventListener("focusout", function () { marqueeTrack.classList.remove("is-paused"); });
  }

  /* ----------------------------------------------------------------------
     FAQ accordion
     ---------------------------------------------------------------------- */
  var faqItems = document.querySelectorAll(".ff-faq-item");
  faqItems.forEach(function (item) {
    var question = item.querySelector(".ff-faq-question");
    question.addEventListener("click", function () {
      var isOpen = item.classList.contains("is-open");
      faqItems.forEach(function (other) {
        other.classList.remove("is-open");
        other.querySelector(".ff-faq-question").setAttribute("aria-expanded", "false");
      });
      if (!isOpen) {
        item.classList.add("is-open");
        question.setAttribute("aria-expanded", "true");
      }
    });
  });

  /* ----------------------------------------------------------------------
     Email opt-in forms (Hero + Final CTA)
     ---------------------------------------------------------------------- */
  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function setupForm(formId) {
    var form = document.getElementById(formId);
    if (!form) return;

    var wrap = form.closest(".ff-form-wrap");
    var errorEl = wrap.querySelector(".ff-form-error");
    var successEl = wrap.querySelector(".ff-form-success");
    var submitBtn = form.querySelector(".ff-btn");
    var input = form.querySelector('input[type="email"]');

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = input.value.trim();

      if (!isValidEmail(email)) {
        errorEl.classList.add("is-visible");
        input.focus();
        return;
      }
      errorEl.classList.remove("is-visible");
      submitBtn.classList.add("is-loading");
      submitBtn.setAttribute("disabled", "true");

      var finish = function () {
        submitBtn.classList.remove("is-loading");
        submitBtn.removeAttribute("disabled");
        form.style.display = "none";
        successEl.classList.add("is-visible");

        if (CONFIG.REDIRECT_URL) {
          window.location.href = CONFIG.REDIRECT_URL;
        }
      };

      if (CONFIG.FORM_ENDPOINT) {
        // "no-cors" is used because most GHL inbound webhooks don't return
        // CORS headers. The response is opaque, so we optimistically treat
        // a resolved fetch as success.
        fetch(CONFIG.FORM_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, source: "FitnessForge Squeeze Page" })
        })
          .then(finish)
          .catch(function () {
            submitBtn.classList.remove("is-loading");
            submitBtn.removeAttribute("disabled");
            errorEl.textContent = "Something went wrong. Please try again.";
            errorEl.classList.add("is-visible");
          });
      } else {
        // No endpoint configured yet — simulate the success state so the
        // page can be previewed. Set CONFIG.FORM_ENDPOINT before going live.
        window.setTimeout(finish, 700);
      }
    });
  }

  setupForm("ff-form-hero");
  setupForm("ff-form-final");

})();
</script>
